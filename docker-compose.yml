# Image tags track the version in the VERSION file (0.2.0 at this writing).
# Override at runtime via TOTH_IMAGE_VERSION (see .env.example); it falls
# back to 0.2.0 when unset. The wrapper's _env() sets TOTH_IMAGE_VERSION
# from .env / environment, so `toth run <profile>` uses the matching tag.

x-toth-common: &toth-common
  image: "toth-base:${TOTH_IMAGE_VERSION:-0.2.0}"
  stdin_open: true
  tty: true
  volumes:
    - ${TOTH_WORKSPACE:-./workspace}/cases:/cases
    - ${TOTH_WORKSPACE:-./workspace}/output:/opt/toth/output

services:
  toth-base:
    <<: *toth-common
    container_name: toth-base
    network_mode: none

  toth-dfir:
    image: "toth-dfir:${TOTH_IMAGE_VERSION:-0.2.0}"
    <<: *toth-common
    container_name: toth-dfir
    network_mode: none

  toth-malware:
    image: "toth-malware:${TOTH_IMAGE_VERSION:-0.2.0}"
    <<: *toth-common
    container_name: toth-malware
    network_mode: none

  toth-network:
    image: "toth-network:${TOTH_IMAGE_VERSION:-0.2.0}"
    <<: *toth-common
    container_name: toth-network
    network_mode: bridge
    cap_add:
      - NET_ADMIN
      - NET_RAW
