name: publish-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xlxxt/toth-base:0.1.0
            ghcr.io/xlxxt/toth-base:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/dfir/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE_IMAGE=ghcr.io/xlxxt/toth-base:0.1.0
          tags: |
            ghcr.io/xlxxt/toth-dfir:0.1.0
            ghcr.io/xlxxt/toth-dfir:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/malware/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE_IMAGE=ghcr.io/xlxxt/toth-base:0.1.0
          tags: |
            ghcr.io/xlxxt/toth-malware:0.1.0
            ghcr.io/xlxxt/toth-malware:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/network/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE_IMAGE=ghcr.io/xlxxt/toth-base:0.1.0
          tags: |
            ghcr.io/xlxxt/toth-network:0.1.0
            ghcr.io/xlxxt/toth-network:latest
