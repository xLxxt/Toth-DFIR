name: publish-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish"
        required: true
        default: "0.1.0"
      push_latest:
        description: "Also publish the latest tag"
        required: true
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: xlxxt
  PLATFORMS: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.image_tag }}"
            push_latest="${{ inputs.push_latest }}"
          else
            image_tag="${GITHUB_REF_NAME#v}"
            push_latest="true"
          fi

          case "$image_tag" in
            ""|*[!a-zA-Z0-9._-]*)
              echo "Invalid image tag: $image_tag" >&2
              exit 1
              ;;
          esac

          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "PUSH_LATEST=$push_latest" >> "$GITHUB_ENV"

      - name: Prepare image tags
        run: |
          write_tags() {
            local env_name="$1"
            local image_name="$2"
            {
              echo "$env_name<<EOF"
              echo "${REGISTRY}/${IMAGE_NAMESPACE}/${image_name}:${IMAGE_TAG}"
              if [ "$PUSH_LATEST" = "true" ]; then
                echo "${REGISTRY}/${IMAGE_NAMESPACE}/${image_name}:latest"
              fi
              echo "EOF"
            } >> "$GITHUB_ENV"
          }

          write_tags BASE_TAGS toth-base
          write_tags DFIR_TAGS toth-dfir
          write_tags MALWARE_TAGS toth-malware
          write_tags NETWORK_TAGS toth-network

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: TOTH_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.BASE_TAGS }}

      - name: Build and publish DFIR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/dfir/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/toth-base:${{ env.IMAGE_TAG }}
            TOTH_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.DFIR_TAGS }}

      - name: Build and publish malware image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/malware/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/toth-base:${{ env.IMAGE_TAG }}
            TOTH_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.MALWARE_TAGS }}

      - name: Build and publish network image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/network/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/toth-base:${{ env.IMAGE_TAG }}
            TOTH_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.NETWORK_TAGS }}
