name: test-tools

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "images/**"
      - "config/**"
      - "tools/**"

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f images/base/Dockerfile -t toth-base:0.1.0 .
      - run: docker run --rm toth-base:0.1.0 bash /opt/toth/scripts/check_tools.sh
